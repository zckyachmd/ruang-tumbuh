name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ruang
          POSTGRES_DB: ruang_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ruang -d ruang_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: development
      APP_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TEST_DATABASE_URL: postgresql://ruang:synthetic-ci-only@localhost:5432/ruang_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui_acceptance.py
      - name: Build runtime image
        run: docker build -t ruang-tumbuh:test .
      - name: Parse production Compose configuration
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          APP_DOMAIN: synthetic.invalid
        run: docker compose -f compose.yaml -f compose.hosted.yaml config --quiet
      - name: Container persistence and database restore
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          python tests/runtime_smoke.py
  who-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - name: Download private server-side reference assets without publishing them
        run: python scripts/install-who-data.py "${RUNNER_TEMP}/who-data"
      - name: Check against official reference SD columns
        run: python scripts/validate-who-reference.py "${RUNNER_TEMP}/who-data"
      - name: Remove licensed workbooks after verification
        if: always()
        run: rm -rf "${RUNNER_TEMP}/who-data"
